<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="calculator">
      <input type="text" id="screen">

      <div class="container">
        <div class="group1">
          <button class="button" id="gray">
            <i class="fa-solid fa-delete-left" id="myimageicon"></i>
          </button>
          <button class="button">7</button>
          <button class="button">4</button>
          <button class="button">1</button>
          <button class="button">
            <i class="fa-solid fa-mobile-retro" id="myimageicon"></i>
          </button>
        </div>
        <div class="group2">
          <button class="button" id="gray">
            <i class="fa-solid fa-plus-minus" id="myimageicon"></i>
          </button>
          <button class="button">8</button>
          <button class="button">5</button>
          <button class="button">2</button>
          <button class="button">0</button>
        </div>
        <div class="group3">
          <button class="button" id="gray">
            <i class="fa-solid fa-percent" id="myimageicon"></i>
          </button>
          <button class="button">9</button>
          <button class="button">6</button>
          <button class="button">3</button>
          <button class="button">.</button>
        </div>
        <div class="group4">
          <button class="button" id="orange">
            <i class="fa-solid fa-divide" id="myimageicon"></i>
          </button>
          <button class="button" id="orange">
            <i class="fa-solid fa-xmark" id="myimageicon"></i>
          </button>
          <button class="button" id="orange">
            <i class="fa-solid fa-minus" id="myimageicon"></i>
          </button>
          <button class="button" id="orange">
            <i class="fa-solid fa-plus" id="myimageicon"></i>
          </button>
          <button class="button" id="orange">
            <i class="fa-solid fa-equals" id="myimageicon"></i>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
